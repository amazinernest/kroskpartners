  <text x="80" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">2Y (26s)</text>
  <text x="150" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">5Y (28s)</text>
  <text x="220" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">10Y (34s)</text>
  <text x="290" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">15Y (37s)</text>
  <text x="360" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">20Y (42s)</text>
  <text x="430" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" text-anchor="middle">30Y (50s)</text>

