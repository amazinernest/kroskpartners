<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="100%" stop-color="#162E52" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="260" fill="#F8FAFC" rx="12" />
  <rect x="0.5" y="0.5" width="479" height="259" fill="none" stroke="#E2E8F0" rx="11.5" />

  <!-- Top Institutional Bar -->
  <rect x="0" y="0" width="480" height="42" fill="url(#headerGrad2)" rx="12 12 0 0" />
  <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.08em">DMO FISCAL DEFICIT &amp; DEBT ISSUANCE MATRIX</text>
  <rect x="360" y="11" width="100" height="20" rx="10" fill="#086430" />
  <text x="410" y="25" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">PAGE 16 AUDIT</text>

  <!-- Subtitle -->
  <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#081426">Federal Government Borrowing Requirement Analysis</text>
  <text x="460" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#086430" text-anchor="end">Target: ₦6.45 Trn</text>

  <!-- Row 1: Original Budget Deficit -->
  <text x="20" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#475569">Approved Budget Deficit</text>
  <text x="460" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#081426" text-anchor="end">₦4.60 Trn</text>
  <rect x="20" y="100" width="440" height="12" rx="6" fill="#E2E8F0" />
  <rect x="20" y="100" width="280" height="12" rx="6" fill="#94A3B8" />

  <!-- Row 2: Supplementary Budget Added -->
  <text x="20" y="133" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#475569">+ Supplementary Budget (+₦1.00T)</text>
  <text x="460" y="133" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#081426" text-anchor="end">₦5.60 Trn</text>
  <rect x="20" y="140" width="440" height="12" rx="6" fill="#E2E8F0" />
  <rect x="20" y="140" width="340" height="12" rx="6" fill="#081426" />

  <!-- Row 3: Prospectus Audited Total Deficit -->
  <text x="20" y="173" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#081426">Eurobond Prospectus (Page 16 Total Deficit)</text>
  <text x="460" y="173" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#086430" text-anchor="end">₦6.45 Trn</text>
  <rect x="20" y="180" width="440" height="14" rx="7" fill="#E2E8F0" />
  <rect x="20" y="180" width="395" height="14" rx="7" fill="#086430" />

  <!-- Key Metric Callout Box -->
  <rect x="20" y="206" width="440" height="42" rx="8" fill="#EEF4FB" stroke="#D1E2F5" />
  <text x="32" y="224" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#081426">UNEXPECTED DMO SUPPLY BUFFER:</text>
  <text x="32" y="238" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="500" fill="#475569">Expected remaining ₦450bn vs Actual requirement: <tspan font-weight="800" fill="#086430">₦1.40 Trillion remaining issuance</tspan></text>
  <rect x="375" y="214" width="75" height="26" rx="6" fill="#081426" />
  <text x="412.5" y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">+₦1.40T BID</text>
</svg>
