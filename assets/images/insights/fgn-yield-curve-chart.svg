      <stop offset="0%" stop-color="#086430" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#086430" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="100%" stop-color="#162E52" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="260" fill="#F8FAFC" rx="12" />
  <rect x="0.5" y="0.5" width="479" height="259" fill="none" stroke="#E2E8F0" rx="11.5" />

  <!-- Top Institutional Bar -->
  <rect x="0" y="0" width="480" height="42" fill="url(#headerGrad)" rx="12 12 0 0" />
  <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.08em">FGN SOVEREIGN BENCHMARK YIELD CURVE</text>
  <rect x="365" y="11" width="95" height="20" rx="10" fill="#086430" />
  <text x="412" y="25" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">ACTIVE DESK RUN</text>

  <!-- Chart Metadata Subheader -->
  <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#081426">Short-Duration Pair Trade: Short 50s vs Long 36s</text>
  <text x="460" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#086430" text-anchor="end">Spread: +35 bps</text>

  <!-- Grid Lines -->
  <line x1="50" y1="90" x2="450" y2="90" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3" />
  <text x="42" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94A3B8" text-anchor="end">16%</text>

  <line x1="50" y1="130" x2="450" y2="130" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3" />
  <text x="42" y="134" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94A3B8" text-anchor="end">14%</text>

  <line x1="50" y1="170" x2="450" y2="170" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3" />
  <text x="42" y="174" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94A3B8" text-anchor="end">12%</text>

  <line x1="50" y1="210" x2="450" y2="210" stroke="#CBD5E1" stroke-width="1" />
  <text x="42" y="214" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94A3B8" text-anchor="end">10%</text>

