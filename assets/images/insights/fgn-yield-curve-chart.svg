  <!-- Coordinates: 
       80, 177 (11.65%)
       150, 166 (12.20%)
       220, 153 (12.85%)
       290, 147 (13.15%)
       360, 131 (13.95%)
       430, 114 (14.80%)
  -->
  <path d="M 80,177 C 120,172 170,162 220,153 C 270,144 320,138 360,131 C 390,125 410,118 430,114 L 430,210 L 80,210 Z" fill="url(#curveGradient)" />
  <path d="M 80,177 C 120,172 170,162 220,153 C 270,144 320,138 360,131 C 390,125 410,118 430,114" fill="none" stroke="#086430" stroke-width="3.5" stroke-linecap="round" />

  <!-- Data Points -->
  <circle cx="80" cy="177" r="5" fill="#FFFFFF" stroke="#081426" stroke-width="2.5" />
  <rect x="52" y="146" width="56" height="18" rx="4" fill="#081426" />
  <text x="80" y="159" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">11.65%</text>

  <circle cx="290" cy="147" r="4" fill="#FFFFFF" stroke="#086430" stroke-width="2" />

  <circle cx="430" cy="114" r="5" fill="#FFFFFF" stroke="#086430" stroke-width="2.5" />
  <rect x="402" y="83" width="56" height="18" rx="4" fill="#086430" />
  <text x="430" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">14.80%</text>

  <!-- Bottom Ticker Strip -->
  <rect x="20" y="240" width="440" height="14" rx="4" fill="#EEF4FB" />
  <text x="240" y="250.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#081426" text-anchor="middle">AUCTION ANALYSIS: DMO CONTINUES OVERSELLING • MORE MONEY THAN INSTRUMENTS</text>
</svg>
